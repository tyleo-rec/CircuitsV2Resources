syntax = "proto3";
package rec_room;

import "core/guid_data.proto";

option csharp_namespace = "RecRoom.Protobuf";

message StudioObjectUnityAssetData {
  core.GuidData unity_sub_asset_id = 1;
  repeated core.GuidData referenced_unity_asset_ids = 2;
  bytes object_board_data = 3;
  string object_board_signature = 4;
}
