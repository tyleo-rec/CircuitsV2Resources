syntax = "proto3";
package circuits_v2;

import "circuits_v2/studio_functions/studio_function_definition_data.proto";
import "circuits_v2/studio_functions/studio_function_signature_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message StudioFunctionRegistrationData {
  StudioFunctionSignatureData signature = 1;
  repeated StudioFunctionDefinitionData definitions = 2;
}
