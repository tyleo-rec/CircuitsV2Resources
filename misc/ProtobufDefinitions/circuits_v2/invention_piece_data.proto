syntax = "proto3";
package circuits_v2;

import "core/guid_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message InventionPieceData {
  core.GuidData instance_id = 5;
  int64 invention_id = 2;
  int32 version_number = 3;
  bool originally_from_other_invention = 4;

  bytes DEPRECATED_instance_id = 1;
}
