syntax = "proto3";
package circuits_v2;
option csharp_namespace = "CircuitsV2.Protobuf";

import "circuits_v2/circuit_interaction_filter_data.proto";
import "circuits_v2/player_world_bar_data.proto";
import "circuits_v2/player_world_text_data.proto";

message PlayerWorldUIData {
  PlayerWorldBarData primary_bar = 1;
  PlayerWorldBarData secondary_bar = 2;
  PlayerWorldTextData text = 3;
  bool synced = 4;
  CircuitInteractionFilterData interaction_filter = 5;
  string name = 6;
}
