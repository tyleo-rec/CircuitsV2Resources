syntax = "proto3";
package circuits_v2;
option csharp_namespace = "CircuitsV2.Protobuf";

message SunConstantNodeData {
  int32 sun_color = 1;
  float sun_intensity = 2;
  float shadow_strength = 3;
  float disc_size = 4;
  int32 glow_color = 5;
  float glow_size = 6;
  float glow_strength = 7;
  float glow_horizon = 8;
  float reflection_intensity = 9;
  bool clip_horizon = 10;

}
