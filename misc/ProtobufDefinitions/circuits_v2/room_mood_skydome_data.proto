syntax = "proto3";
package circuits_v2;

import "circuits_v2/room_mood_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message RoomMoodSkydomeData {
  circuits_v2.RoomMoodData mood_base_data = 1;
  int32 sky_bottom = 2;
  int32 sky_top = 3;
  int32 ground_bottom = 4;
  int32 ground_top = 5;
  int32 horizon_color = 6;
  float horizon_size = 7;
  float horizon_strength = 8;
}
