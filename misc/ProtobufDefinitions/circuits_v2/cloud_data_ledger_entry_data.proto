syntax = "proto3";
package circuits_v2;
option csharp_namespace = "CircuitsV2.Protobuf";

import "core/guid_data.proto";

import "circuits_v2/cloud_data_ledger_type.proto";

message CloudDataLedgerEntryData {
  string name = 1;
  core.GuidData guid = 2;
  repeated int64 subrooms = 3;
  bool prospective = 4;
  CloudDataLedgerType ledgerType = 5;
}
