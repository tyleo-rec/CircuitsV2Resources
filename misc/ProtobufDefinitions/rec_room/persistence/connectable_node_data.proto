syntax = "proto3";
package rec_room;
option csharp_namespace = "RecRoom.Protobuf";

import "core/vector3_data.proto";

message ConnectableGraphData {
  ConnectableNodeData root_node = 1;
}

message ConnectableNodeData {
  oneof Id {
    bytes persistence_id = 1;
    int32 photon_id = 8;
    int32 entity_idx = 9;
  }

  int32 slot_index = 2;
  int32 parent_slot_index = 3;
  core.Vector3Data position_relative_to_parent = 4;
  core.Vector3Data rotation_relative_to_parent = 5;
  repeated ConnectableNodeData children = 6;
  bool is_root = 7;
}
