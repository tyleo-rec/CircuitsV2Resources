syntax = "proto3";
package circuits_v2;
option csharp_namespace = "CircuitsV2.Protobuf";

import "circuits/static/rec_room/named_type_data.proto";

message FunctionDeclInstData {
  string filter = 2;
  repeated circuits.NamedTypeData inputs = 3;
  repeated circuits.NamedTypeData outputs = 4;
  string description = 5;

  
  string DEPRECATED_name = 1;
}
