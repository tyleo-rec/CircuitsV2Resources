syntax = "proto3";
package rec_room;
option csharp_namespace = "RecRoom.Protobuf";

import "rec_room/persistence/interaction_filter.proto";

message InvisibleCollisionV2Data {
  bool collide_with_players = 1;
  InteractionFilterData DEPRECATED_interaction_filter_data = 2;
  bool collide_with_objects = 3;
  bool collide_with_projectiles = 4;
  bool occludes_targeting = 5;
  bool disabled = 6;
}
