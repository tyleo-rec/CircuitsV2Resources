syntax = "proto3";
package circuits_v2;

import "circuits_v2/studio_functions/studio_function_port_declaration_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message StudioFunctionSignatureData {
  string name = 1;
  repeated StudioFunctionPortDeclarationData inputs = 2;
  repeated StudioFunctionPortDeclarationData outputs = 3;
}
