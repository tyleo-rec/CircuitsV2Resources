syntax = "proto3";
package circuits_v2;

import "circuits_v2/deprecated/DEPRECATED_event_registration_data.proto";
import "circuits_v2/node_desc_data.proto";
import "circuits_v2/rpc_target.proto";
import "core/guid_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message EventSenderNodeData {
  NodeDescData node_desc = 1;
  core.GuidData event_id = 4;
  RpcTarget rpc_target = 3;

  DEPRECATED_EventRegistrationData DEPRECATED_event_registration = 2;
}
