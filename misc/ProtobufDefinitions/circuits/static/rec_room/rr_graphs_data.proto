syntax = "proto3";
package circuits;

import "circuits/shared/utilities/soa_id_32_data.proto";
import "circuits/static/rec_room/function_graph_data.proto";
import "circuits/static/rec_room/rr_graph_data.proto";

option csharp_namespace = "Circuits.Static.RecRoom.Protobuf";

message RRGraphsData {
  repeated RRGraphData items = 1;

  SOAId32Data function_graph_ids = 2;
  repeated FunctionGraphData function_graphs = 3;
}
