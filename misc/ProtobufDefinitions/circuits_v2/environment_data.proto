syntax = "proto3";
package circuits_v2;

import "circuits_v2/entity_definition_data.proto";
import "circuits_v2/orphan_data.proto";
import "core/guid_data.proto";

option csharp_namespace = "CircuitsV2.Protobuf";

message EnvironmentData {
  repeated EntityDefinitionData entities = 1;
  repeated OrphanData orphans = 2;
  repeated core.GuidData contexts = 3;
}
