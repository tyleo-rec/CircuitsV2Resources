syntax = "proto3";
package circuits;

import "circuits/shared/utilities/soa_id_32_data.proto";
import "circuits/static/rec_room/function_node_data.proto";
import "circuits/static/rec_room/rr_node_data.proto";

option csharp_namespace = "Circuits.Static.RecRoom.Protobuf";

message RRGraphData {
  repeated RRNodeData rr_nodes = 1;

  SOAId32Data function_node_ids = 2;
  repeated FunctionNodeData function_nodes = 3;
}
